<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北营子村 · 地图导览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; }
  .topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#5c0f0f; color:#fff; flex-wrap:wrap; z-index:10; }
  .topbar a { color:#e8c87a; text-decoration:none; font-size:14px; }
  .topbar .hint { margin-left:auto; font-size:12px; color:#d4a843; }
  #map-frame { flex:1; border:none; width:100%; display:block; }
  /* 地图加载失败提示 */
  .fallback { display:none; position:absolute; inset:60px 20px 20px; background:#fff; border-radius:14px; padding:28px; text-align:center; color:#555; font-size:14px; line-height:2; }
  .fallback a { color:#8b1a1a; }
</style>
</head>
<body>
<div class="topbar">
  <a href=" ">← 返回首页</a >
  <span class="hint">百度地图 · 可直接缩放拖动</span>
</div>

<!-- 百度地图嵌入：这就是你分享得到的 j.map.baidu.com 短链 -->
<iframe id="map-frame" src="https://j.map.baidu.com/33/MMDM"
        allowfullscreen="true" loading="lazy"></iframe>

<div class="fallback" id="fallback">
  <p>地图加载失败 😢</p >
  <p>请在<b>电脑浏览器</b>中打开本页面，或<br>
  <a href="https://j.map.baidu.com/33/MMDM" target="_blank">点这里直接打开百度地图</a ></p >
</div>

<script>
// 30 秒后地图还没加载出来（iframe 内出现百度错误页高度异常时人工处理），显示兜底提示
setTimeout(function(){
  try {
    var f = document.getElementById("map-frame");
    // 无法跨域读取 iframe 内容，这里只检测极端情况：页面完全空白时给出提示链接
    if (!f.contentWindow && !f.contentDocument) {
      document.getElementById("fallback").style.display = "block";
    }
  } catch(e) { /* 跨域，忽略 */ }
}, 30000);
</script>
</body>
</html>
