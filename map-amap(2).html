<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北营子村 · 地图导览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; }
  .topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#5c0f0f; color:#fff; z-index:10; }
  .topbar a { color:#e8c87a; text-decoration:none; font-size:14px; }
  .topbar .hint { margin-left:auto; font-size:12px; color:#d4a843; }
  #holder { flex:1; }
  #holder iframe { width:100%; height:100%; border:none; display:block; }
</style>
</head>
<body>
<div class="topbar">
  <span id="back"></span>
  <span class="hint">百度地图 · 可缩放拖动</span>
</div>
<div id="holder"></div>
<script>
// 用 JS 创建 iframe，防止标签被复制改坏；不需要任何 Key
var a = document.createElement('a');
a.href = 'index.html';
a.textContent = '← 返回首页';
a.style.color = '#e8c87a';
a.style.textDecoration = 'none';
a.style.fontSize = '14px';
document.getElementById('back').appendChild(a);

var f = document.createElement('iframe');
f.src = 'https://j.map.baidu.com/33/MMDM';
document.getElementById('holder').appendChild(f);
</script>
</body>
</html>
